# Verified Kitchen — local MQTT broker (Mosquitto 2.x)
# Start with ./run.sh (paths below are relative to this folder).

# Plain MQTT on the local network only. Credentials + ACL are required; anonymous
# clients are refused. (TLS can be added with a "listener 8883" block if the
# node ever has to cross an untrusted network.)
listener 1883
allow_anonymous false
password_file passwd
acl_file acl

# Keep QoS 1 messages and retained status across broker restarts.
persistence true
persistence_location data/

# Small payloads only (telemetry is ~300 bytes).
max_packet_size 4096
max_inflight_messages 20
max_queued_messages 3000

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
