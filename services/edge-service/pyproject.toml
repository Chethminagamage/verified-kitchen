[project]
name = "edge-service"
version = "0.1.0"
description = "Verified Kitchen edge service: evidence ingestion, hygiene scoring, violations and audit writes"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "supabase>=2.34.0",
]

[project.scripts]
edge-service = "edge_service.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_service"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow °, — and similar characters in text

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
